<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Collection | FryMediaOfficial</title>
    <style>
        body {
            background-color: #080808; color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
            transition: background 0.5s;
        }

        /* --- THEME NEON MODE (Pinky Mood buat Cantika 🗿💖) --- */
        body.neon-mode { background-color: #0d0005; }
        body.neon-mode .glowing-title { background: linear-gradient(90deg, #ff0055, #d4af37, #ff0055); -webkit-background-clip: text; }
        body.neon-mode #cursor-outline { border-color: #ff0055; }
        body.neon-mode .filter-btn.active { background: #ff0055; border-color: #ff0055; }
        body.neon-mode .creed-block { color: #ff0055; border-top-color: rgba(255, 0, 85, 0.2); }

        /* --- CURSOR LOGIC --- */
        * { cursor: none !important; }
        #cursor-dot {
            width: 8px; height: 8px; background: #d4af37; 
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 10000; transform: translate(-50%, -50%); left: -100px; top: -100px;
        }
        #cursor-outline {
            width: 30px; height: 30px; border: 2px solid #4facfe; 
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%); left: -100px; top: -100px;
            transition: width 0.2s, height 0.2s, border-color 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 10px; color: #d4af37;
        }
        .cursor-hover-active {
            width: 50px !important; height: 50px !important;
            background: rgba(79, 172, 254, 0.15) !important;
            border-color: #d4af37 !important; 
        }

        .logo-pulse {
            width: 90px; filter: drop-shadow(0 0 10px #4facfe);
            animation: logo-glow 2s ease-in-out infinite alternate;
            transition: 0.3s;
        }
        @keyframes logo-glow {
            from { filter: drop-shadow(0 0 5px #4facfe); transform: scale(1); }
            to { filter: drop-shadow(0 0 20px #d4af37); transform: scale(1.05); }
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            display: flex; justify-content: flex-end; align-items: center; 
            padding: 40px 5%; background: rgba(10, 10, 10, 0.85); 
            border-bottom: 2px solid #2a4d69; position: relative; z-index: 10;
            backdrop-filter: blur(10px);
        }
        .live-info { position: absolute; left: 5%; top: 50%; transform: translateY(-50%); text-align: left; }
        #clock { font-size: 1.2rem; color: #4facfe; font-weight: bold; margin: 0; }
        #status-text { font-size: 0.7rem; color: #d4af37; text-transform: uppercase; letter-spacing: 1px; }

        .glowing-title {
            font-size: 2.2rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            background: linear-gradient(90deg, #4facfe, #d4af37, #4facfe);
            background-size: 200% auto; -webkit-background-clip: text;
            -webkit-text-fill-color: transparent; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        #typing-text { color: #a0a0a0; font-style: italic; font-size: 0.9rem; min-height: 1.2em; margin-top: 5px; }

        .main-container {
            max-width: 900px; margin: 60px auto; padding: 40px; 
            background: rgba(255, 255, 255, 0.03); border-radius: 30px;
            border: 1px dashed #4facfe; position: relative; z-index: 10;
            backdrop-filter: blur(5px);
        }

        .filter-buttons { margin: 40px 0 30px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .filter-btn {
            padding: 12px 28px; background: transparent; border: 1px solid #2a4d69;
            color: #ccc; border-radius: 50px; font-weight: 600; cursor: none; transition: 0.3s;
        }
        .filter-btn.active { background: #4facfe; color: white; border-color: #4facfe; box-shadow: 0 0 15px rgba(79, 172, 254, 0.4); }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px; max-width: 1100px; margin: 0 auto 80px; padding: 20px;
        }
        .gallery-item {
            background: rgba(24, 24, 24, 0.7); padding: 15px; border-radius: 20px;
            border: 1px solid #2a4d69; transition: 0.4s; position: relative;
        }
        .gallery-item.hide { display: none; }
        .gallery-item:hover { transform: translateY(-10px); border-color: #d4af37; }
        .gallery-item img { width: 100%; height: 350px; object-fit: cover; border-radius: 15px; }

        .rating-badge {
            position: absolute; top: 25px; right: 25px; background: rgba(0,0,0,0.8);
            padding: 5px 10px; border-radius: 10px; border: 1px solid #d4af37; font-size: 0.8rem;
        }

        .floating-contact { position: fixed; bottom: 30px; right: 30px; z-index: 100; display: flex; flex-direction: column; gap: 15px; }
        .float-btn {
            width: 55px; height: 55px; border-radius: 50%; background: #4facfe;
            display: flex; align-items: center; justify-content: center;
            color: white; text-decoration: none; font-size: 24px; transition: 0.3s; border: none;
        }

        footer { padding: 40px; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div id="particles-js"></div>

    <div class="floating-contact">
        <button onclick="toggleNeonMode()" class="float-btn" style="background: #ff0055;" id="theme-btn">🎨</button>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="float-btn" style="background: #d4af37;">☝️</button>
    </div>

    <header>
        <div class="live-info">
            <p id="clock">00:00:00</p>
            <p id="status-text">● WATCHING ANIME</p>
        </div>
        <div>
            <h1 class="glowing-title">ANIME VAULT 🗿</h1>
            <p id="typing-text"></p> 
        </div>
    </header>

    <div class="main-container">
        <h2 style="color: #4facfe; letter-spacing: 2px;">PERSONAL COLLECTION 🎞️</h2>
        <p style="color: #ccc;">Tempat nyimpen daftar anime favorit Sandi. Biar gak lupa udah rewatch berapa kali. 🗿</p>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGallery('all')">SEMUA</button>
        <button class="filter-btn" onclick="filterGallery('watching')">WATCHING</button>
        <button class="filter-btn" onclick="filterGallery('completed')">TAMAT</button>
    </div>
    
    <div class="gallery" id="anime-list">
        </div>

    <footer>&copy; 2026 FryMediaOfficial. Personal Anime Tracker.</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 50}, "color": {"value": "#4facfe"}, "size": {"value": 2}, "move": {"enable": true, "speed": 1}}});

    // DATA ANIME KAMU DI SINI 🗿
    const myAnimes = [
        {
            title: "Otonari no Tenshi-sama",
            status: "completed",
            image: "https://myanimelist.net/images/anime/1989/154843.jpg", // Link sakti kamu
            rating: "10/10"
        },
        {
            title: "One Piece",
            status: "watching",
            image: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg",
            rating: "9.5/10"
        }
    ];

    function renderAnime() {
        const container = document.getElementById('anime-list');
        container.innerHTML = myAnimes.map(anime => `
            <div class="gallery-item ${anime.status}">
                <div class="rating-badge">⭐ ${anime.rating}</div>
                <img src="${anime.image}">
                <h3>${anime.title}</h3>
                <p style="color: #4facfe; font-size: 0.8rem; text-transform: uppercase;">${anime.status}</p>
            </div>
        `).join('');
    }

    const dot = document.getElementById("cursor-dot");
    const outline = document.getElementById("cursor-outline");
    let mouseX = -100, mouseY = -100, outlineX = -100, outlineY = -100;

    window.addEventListener("mousemove", e => {
        mouseX = e.clientX; mouseY = e.clientY;
        dot.style.left = mouseX + "px"; dot.style.top = mouseY + "px";
    });

    function animateCursor() { 
        outlineX += (mouseX - outlineX) * 0.15; outlineY += (mouseY - outlineY) * 0.15; 
        outline.style.left = outlineX + "px"; outline.style.top = outlineY + "px"; 
        requestAnimationFrame(animateCursor); 
    }
    animateCursor();

    function toggleNeonMode() { document.body.classList.toggle('neon-mode'); }

    const tagline = '"Daftar Anime Pilihan Sang Panglima 🗿"';
    let i = 0;
    function typeEffect() { 
        if (i < tagline.length) { document.getElementById("typing-text").innerHTML += tagline.charAt(i); i++; setTimeout(typeEffect, 80); } 
    }

    function filterGallery(category) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        const items = document.querySelectorAll('.gallery-item');
        items.forEach(item => { (category === 'all' || item.classList.contains(category)) ? item.classList.remove('hide') : item.classList.add('hide'); });
    }

    window.onload = () => {
        renderAnime();
        typeEffect();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000);
    };
    </script>
</body>
</html>
