<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Vault | FryMediaOfficial</title>
    <style>
        :root {
            --pink-neon: #ff0055;
            --pink-glow: rgba(255, 0, 85, 0.4);
            --bg: #0d0005;
            --card-bg: #1e000e;
            --border: rgba(255, 0, 85, 0.2);
            --text-light: #ffccd9;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        /* --- CURSOR ANIMATION (BALIK LAGI JIR 🗿🔥) --- */
        * { cursor: none !important; }
        #cursor-dot {
            width: 8px; height: 8px; background: var(--pink-neon); 
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 10000; transform: translate(-50%, -50%); left: -100px; top: -100px;
        }
        #cursor-outline {
            width: 30px; height: 30px; border: 2px solid var(--pink-neon); 
            position: fixed; border-radius: 50%; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%); left: -100px; top: -100px;
            transition: width 0.2s, height 0.2s, background 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 10px;
        }
        .cursor-hover-active {
            width: 50px !important; height: 50px !important;
            background: rgba(255, 0, 85, 0.15) !important;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            padding: 20px 5%; background: rgba(13, 0, 5, 0.85); 
            border-bottom: 2px solid var(--border); position: relative; z-index: 10;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
        }

        .clock-container { font-size: 1.2rem; color: var(--pink-neon); font-weight: bold; margin-bottom: 5px; }

        .glowing-title {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            color: var(--pink-neon); filter: drop-shadow(0 0 8px var(--pink-glow));
        }

        .main-container {
            max-width: 900px; margin: 25px auto; padding: 20px; 
            background: rgba(255, 0, 85, 0.02); border-radius: 20px;
            border: 1px dashed var(--border); position: relative; z-index: 10;
        }

        .filter-buttons { margin: 20px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 18px; background: transparent; border: 1px solid var(--pink-neon);
            color: var(--pink-neon); border-radius: 50px; font-weight: 600; font-size: 0.8rem; transition: 0.3s;
        }
        .filter-btn.active { background: var(--pink-neon); color: white; box-shadow: 0 0 10px var(--pink-neon); }

        .gallery {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; max-width: 1100px; margin: 0 auto 80px; padding: 15px;
        }
        
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } }

        .gallery-item {
            background: var(--card-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            text-align: left;
        }
        .gallery-item img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; }
        .gallery-item h3 { font-size: 0.85rem; margin: 10px 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: white; }
        .gallery-item.hide { display: none; }

        .rating-badge {
            position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8);
            padding: 3px 8px; border-radius: 8px; border: 1px solid var(--pink-neon); font-size: 0.7rem;
            color: var(--pink-neon); font-weight: bold;
        }

        .status-label { color: var(--pink-neon); font-size: 0.65rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }

        .floating-contact { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .float-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--pink-neon); color: white; border: none; font-size: 18px; box-shadow: 0 0 10px var(--pink-glow); }

        footer { padding: 30px; color: #55001a; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div id="particles-js"></div>

    <div class="floating-contact">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="float-btn">☝️</button>
    </div>

    <header>
        <div class="clock-container"><span id="clock">00:00:00</span></div>
        <h1 class="glowing-title">ANIME VAULT</h1>
    </header>

    <div class="main-container">
        <p style="color: var(--text-light); margin:0; font-size: 0.85rem; font-style: italic;">
            Daftar Anime Pilihan Sanzs 💖
        </p>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGallery('all')">SEMUA</button>
        <button class="filter-btn" onclick="filterGallery('watching')">WATCHING</button>
        <button class="filter-btn" onclick="filterGallery('completed')">TAMAT</button>
    </div>
    
    <div class="gallery" id="anime-list"></div>

    <footer>&copy; 2026 FryMediaOfficial | Sanzs' Vault</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#ff0055"}, "size": {"value": 1}, "move": {"enable": true, "speed": 1}}});

    const myAnimes = [
        {
            title: "Otonari no Tenshi-sama",
            status: "completed",
            image: "https://myanimelist.net/images/anime/1989/154843.jpg",
            rating: "10/10"
        },
        {
            title: "One Piece",
            status: "watching",
            image: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg",
            rating: "9.5/10"
        },
        {
            title: "Solo Leveling",
            status: "completed",
            image: "https://cdn.myanimelist.net/images/anime/1258/126920.jpg",
            rating: "8.5/10"
        }
    ];

    function renderAnime() {
        document.getElementById('anime-list').innerHTML = myAnimes.map(anime => `
            <div class="gallery-item ${anime.status}">
                <div class="rating-badge">⭐ ${anime.rating.split('/')[0]}</div>
                <img src="${anime.image}">
                <h3>${anime.title}</h3>
                <span class="status-label">${anime.status}</span>
            </div>
        `).join('');
    }

    // --- LOGIKA CURSOR BALIK LAGI ---
    const dot = document.getElementById("cursor-dot");
    const outline = document.getElementById("cursor-outline");
    let mouseX = -100, mouseY = -100, outlineX = -100, outlineY = -100;

    window.addEventListener("mousemove", e => {
        mouseX = e.clientX; mouseY = e.clientY;
        dot.style.left = mouseX + "px"; dot.style.top = mouseY + "px";
    });

    function animateCursor() { 
        outlineX += (mouseX - outlineX) * 0.15; outlineY += (mouseY - outlineY) * 0.15; 
        outline.style.left = outlineX + "px"; outline.style.top = outlineY + "px"; 
        requestAnimationFrame(animateCursor); 
    }
    animateCursor();

    // Hover effect biar outline cursor-nya membesar
    document.addEventListener("mouseover", e => { 
        if (e.target.closest('button, .gallery-item')) outline.classList.add("cursor-hover-active"); 
    });
    document.addEventListener("mouseout", e => { 
        if (e.target.closest('button, .gallery-item')) outline.classList.remove("cursor-hover-active"); 
    });

    function filterGallery(category) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.gallery-item').forEach(item => { (category === 'all' || item.classList.contains(category)) ? item.classList.remove('hide') : item.classList.add('hide'); });
    }

    window.onload = () => { renderAnime(); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000); };
    </script>
</body>
</html>
