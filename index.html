<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Vault | FryMediaOfficial</title>
    <style>
        :root {
            --pink-neon: #ff0055;
            --pink-glow: rgba(255, 0, 85, 0.4);
            --bg: #0d0005;
            --card-bg: #1e000e;
            --border: rgba(255, 0, 85, 0.2);
            --text-light: #ffccd9;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            padding: 20px 5%; background: rgba(13, 0, 5, 0.85); 
            border-bottom: 2px solid var(--border); position: relative; z-index: 10;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
        }

        .clock-container { font-size: 1.2rem; color: var(--pink-neon); font-weight: bold; margin-bottom: 5px; }

        .glowing-title {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            color: var(--pink-neon); filter: drop-shadow(0 0 8px var(--pink-glow));
        }

        .main-container {
            max-width: 900px; margin: 25px auto; padding: 20px; 
            background: rgba(255, 0, 85, 0.02); border-radius: 20px;
            border: 1px dashed var(--border); position: relative; z-index: 10;
        }

        .filter-buttons { margin: 20px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .filter-btn {
            padding: 8px 18px; background: transparent; border: 1px solid var(--pink-neon);
            color: var(--pink-neon); border-radius: 50px; font-weight: 600; font-size: 0.8rem; transition: 0.3s;
        }
        .filter-btn.active { background: var(--pink-neon); color: white; box-shadow: 0 0 10px var(--pink-neon); }

        .gallery {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; max-width: 1100px; margin: 0 auto 80px; padding: 12px;
        }
        
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); } }

        .gallery-item {
            background: var(--card-bg); padding: 10px; border-radius: 15px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            text-align: left; display: flex; flex-direction: column;
        }
        .gallery-item h3 { 
            font-size: 0.8rem; margin: 8px 0 4px 0; color: white;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .status-info { color: var(--pink-neon); font-size: 0.65rem; font-weight: bold; letter-spacing: 0.5px; }

        .floating-contact { position: fixed; bottom: 20px; right: 20px; z-index: 100; }
        .float-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--pink-neon); color: white; border: none; font-size: 18px; box-shadow: 0 0 10px var(--pink-glow); }

        footer { padding: 30px; color: #55001a; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="floating-contact">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="float-btn">☝️</button>
    </div>

    <header>
        <div class="clock-container"><span id="clock">00:00:00</span></div>
        <h1 class="glowing-title">ANIME VAULT</h1>
    </header>

    <div class="main-container">
        <p style="color: var(--text-light); margin:0; font-size: 0.85rem; font-style: italic;">
            Daftar Anime Pilihan Sanzs 💖
        </p>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGallery('all')">SEMUA</button>
        <button class="filter-btn" onclick="filterGallery('watching')">PROSES</button>
        <button class="filter-btn" onclick="filterGallery('completed')">TAMAT</button>
    </div>
    
    <div class="gallery" id="anime-list"></div>

    <footer>&copy; 2026 FryMediaOfficial | Sanzs' Vault</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#ff0055"}, "size": {"value": 1}, "move": {"enable": true, "speed": 1}}});

    const myAnimes = [
        { title: "Tonikaku Kawaii", info: "[S1✅ | S2✅ | OVA✅] ❓", status: "completed" },
        { title: "Spy X Family", info: "[S1✅ | S2✅ | S3📥] ❓", status: "watching" },
        { title: "Horimiya", info: "[S1✅ | S2📥] ❓", status: "watching" },
        { title: "Tsuki Ga Kirei", info: "📥", status: "watching" },
        { title: "Chuunibyou Demo Koi Ga Shitai", info: "[S1⏳ | S2📥] 🔚", status: "watching" },
        { title: "Shiro Seijo To Kuro Bokushi", info: "[S1✅] ❓", status: "completed" },
        { title: "Giji Harem", info: "✅ 🔚", status: "completed" },
        { title: "Tokidoki Bosotto Russia De Dereru Tonari No Alya San", info: "[S1✅ | S2📢]", status: "completed" },
        { title: "The Angel Next Door Spoils Me Rotten", info: "[S1✅(rewatch 40x) | S2⏳]", status: "completed" },
        { title: "The Girl I Like Forgot Her Glasses", info: "✅ ❓", status: "completed" },
        { title: "Gimai Seikatsu", info: "✅❓", status: "completed" },
        { title: "Kaoru Hana wa Rin to Saku", info: "✅❓", status: "completed" },
        { title: "Taisho Otome Otogibanashi", info: "✅❓", status: "completed" },
        { title: "Mamahaha no tsurego ga motokano datta", info: "✅❓", status: "completed" },
        { title: "Kubo-san wa mob wo yurusanai", info: "✅❓", status: "completed" },
        { title: "Kimi wa houkage insomnia", info: "✅❓", status: "completed" },
        { title: "Bokiyou na senpai", info: "⏳", status: "watching" },
        { title: "Yuru camp", info: "[S1⏳ | S2📥 | S3📥 | S4❓]", status: "watching" },
        { title: "Seihantai na Kimi to Boku", info: "[S1✅ | S2📢]", status: "completed" },
        { title: "Kimi ni todake", info: "⏳", status: "watching" }
    ];

    function renderAnime() {
        document.getElementById('anime-list').innerHTML = myAnimes.map(anime => `
            <div class="gallery-item ${anime.status}">
                <h3>${anime.title}</h3>
                <span class="status-info">${anime.info}</span>
            </div>
        `).join('');
    }

    function filterGallery(category) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.gallery-item').forEach(item => { 
            (category === 'all' || item.classList.contains(category)) ? item.classList.remove('hide') : item.classList.add('hide'); 
        });
    }

    window.onload = () => { renderAnime(); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000); };
    </script>
</body>
</html>
