<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Vault | FryMediaOfficial</title>
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        :root {
            --pink-neon: #ff0055;
            --pink-glow: rgba(255, 0, 85, 0.4);
            --bg: #0d0005;
            --card-bg: #1e000e;
            --border: rgba(255, 0, 85, 0.2);
            --text-light: #ffccd9;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            padding: 20px 5%; background: rgba(13, 0, 5, 0.85); 
            border-bottom: 2px solid var(--border); position: relative; z-index: 10;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
        }

        .clock-container { font-size: 1.2rem; color: var(--pink-neon); font-weight: bold; margin-bottom: 5px; }
        .glowing-title {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            color: var(--pink-neon); filter: drop-shadow(0 0 8px var(--pink-glow));
        }

        .main-container {
            max-width: 900px; margin: 20px auto; padding: 15px; 
            background: rgba(255, 0, 85, 0.02); border-radius: 20px;
            border: 1px dashed var(--border); position: relative; z-index: 10;
        }

        .search-container { margin: 15px auto; max-width: 400px; padding: 0 15px; }
        .search-bar {
            width: 100%; padding: 10px 15px; border-radius: 50px;
            border: 1px solid var(--pink-neon); background: rgba(30, 0, 14, 0.6);
            color: white; font-size: 0.9rem; outline: none; box-sizing: border-box;
            transition: 0.3s; text-align: center;
        }
        .search-bar:focus { box-shadow: 0 0 10px var(--pink-neon); }

        .filter-buttons { margin: 10px 0 20px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 10px; }
        .filter-btn {
            padding: 8px 12px; background: transparent; border: 1px solid var(--pink-neon);
            color: var(--pink-neon); border-radius: 50px; font-weight: 600; font-size: 0.7rem; transition: 0.3s;
            cursor: pointer; text-transform: uppercase;
        }
        .filter-btn.active { background: var(--pink-neon); color: white; box-shadow: 0 0 10px var(--pink-neon); }

        .gallery {
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 12px; max-width: 1100px; margin: 0 auto 80px; padding: 12px;
        }
        
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }

        .gallery-item {
            background: var(--card-bg); padding: 8px; border-radius: 15px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            text-align: left; overflow: hidden; cursor: pointer;
        }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 5px 15px var(--pink-glow); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .gallery-item h3 { font-size: 0.8rem; margin: 8px 0 4px 0; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.2em; line-height: 1.1em; }
        .gallery-item.hide { display: none !important; }

        .type-badge {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.7);
            color: #fff; padding: 2px 6px; border-radius: 5px; font-size: 0.6rem; font-weight: bold;
            border: 1px solid var(--border); z-index: 2;
        }

        .genre-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .genre-tag { background: rgba(255, 0, 85, 0.15); color: #ff99bb; font-size: 0.55rem; padding: 1px 5px; border-radius: 3px; text-transform: uppercase; border: 1px solid rgba(255, 0, 85, 0.3); }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 0, 5, 0.95); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1e000e; width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto;
            padding: 25px; border-radius: 20px; border: 2px solid var(--pink-neon);
            box-shadow: 0 0 25px var(--pink-neon); position: relative; text-align: left;
        }
        .close-btn {
            position: absolute; top: 15px; right: 15px; width: 35px; height: 35px;
            background: var(--pink-neon); border: none; border-radius: 50%;
            color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; z-index: 11;
        }

        .anime-detail-layout { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .anime-detail-layout img { width: 150px; height: 220px; object-fit: cover; border-radius: 10px; border: 1px solid var(--pink-neon); }
        .anime-info-text { flex: 1; min-width: 250px; }

        .video-container {
            position: relative; width: 100%; padding-bottom: 56.25%;
            height: 0; border-radius: 10px; overflow: hidden; background: #000;
            margin: 15px 0; display: none;
        }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .ads-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 10, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; border-radius: 10px;
        }
        .ads-btn {
            padding: 12px 24px; background: var(--pink-neon); border: none;
            color: white; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 15px var(--pink-neon); font-size: 0.9rem; text-transform: uppercase;
        }

        .selector-title { font-size: 1rem; color: var(--pink-neon); font-weight: bold; margin: 15px 0 5px; }
        .season-tabs, .episode-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        
        .tab-btn, .ep-btn {
            padding: 8px 16px; background: rgba(255, 0, 85, 0.1); border: 1px solid var(--border);
            color: white; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.3s;
        }
        .tab-btn.active, .ep-btn.active, .ep-btn:hover, .tab-btn:hover {
            background: var(--pink-neon); border-color: var(--pink-neon); box-shadow: 0 0 8px var(--pink-neon);
        }
        .ep-btn { min-width: 60px; text-align: center; }

        footer { padding: 30px; color: #55001a; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <header>
        <div class="clock-container"><span id="clock">00:00:00</span></div>
        <h1 class="glowing-title">ANIME VAULT</h1>
    </header>

    <div class="main-container">
        <p style="color: var(--text-light); margin:0; font-size: 0.85rem; font-style: italic;">Daftar & Streaming Anime Pilihan Sanzs 💖</p>
    </div>

    <div class="search-container">
        <input type="text" id="searchAnime" class="search-bar" placeholder="Cari judul anime kamu di sini..." onkeyup="searchAnimeFunc()">
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGenre('all', this)">SEMUA</button>
        <button class="filter-btn" onclick="filterGenre('romance', this)">ROMANCE</button>
        <button class="filter-btn" onclick="filterGenre('comedy', this)">COMEDY</button>
        <button class="filter-btn" onclick="filterGenre('drama', this)">DRAMA</button>
        <button class="filter-btn" onclick="filterGenre('fantasy', this)">FANTASY</button>
        <button class="filter-btn" onclick="filterGenre('slice-of-life', this)">SLICE OF LIFE</button>
        <button class="filter-btn" onclick="filterGenre('supernatural', this)">SUPERNATURAL</button>
        <button class="filter-btn" onclick="filterGenre('action', this)">ACTION</button>
        <button class="filter-btn" onclick="filterGenre('sci-fi', this)">SCI-FI</button>
    </div>
    
    <div class="gallery" id="anime-list"></div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">X</button>
            
            <div class="anime-detail-layout">
                <img id="modalPoster" src="" alt="Poster">
                <div class="anime-info-text">
                    <h2 id="modalTitle" style="margin: 0 0 10px 0; font-size: 1.5rem; color: white;">Judul Anime</h2>
                    <div id="modalGenres" class="genre-labels" style="margin-bottom: 10px;"></div>
                    <p style="font-size: 0.85rem; color: #ffccd9; margin: 0;">Silakan pilih Season dan Episode di bawah ini untuk memulai streaming.</p>
                </div>
            </div>

            <div class="selector-title">PILIH SEASON:</div>
            <div class="season-tabs" id="seasonTabs"></div>

            <div class="selector-title">PILIH EPISODE:</div>
            <div class="episode-grid" id="episodeGrid"></div>

            <div class="video-container" id="videoWrapper">
                <div id="adsLayer" class="ads-overlay">
                    <p style="font-size: 0.85rem; margin-bottom: 15px; text-align:center;">Sponsori FryMedia dengan mengeklik tombol di bawah ini untuk menonton!</p>
                    <button class="ads-btn" onclick="triggerAd()">Saksikan & Lewati Iklan 🚀</button>
                </div>
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 FryMediaOfficial | Sanzs' Vault</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="database.js"></script>

    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#ff0055"}, "size": {"value": 1}, "move": {"enable": true, "speed": 1}}});

    let currentVideoUrl = "";
    let currentGenreFilter = "all";
    let activeAnimeIndex = null;
    let activeSeasonIndex = 0;

    function renderAnime() {
        document.getElementById('anime-list').innerHTML = myAnimes.map((anime, index) => {
            const genresHtml = anime.genres.map(g => `<span class="genre-tag">${g}</span>`).join('');
            return `
                <div class="gallery-item type-${anime.type}" data-genres="${anime.genres.join(',')}" onclick="openAnimeUI(${index})">
                    <div class="type-badge">${anime.type.toUpperCase()}</div>
                    <img src="${anime.img}" alt="${anime.title}">
                    <h3>${anime.title}</h3>
                    <div class="genre-labels">${genresHtml}</div>
                </div>
            `;
        }).join('');
    }

    function filterGenre(genre, btnElement) {
        currentGenreFilter = genre;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.add('active');
        applyFilterAndSearch();
    }

    function searchAnimeFunc() { applyFilterAndSearch(); }

    function applyFilterAndSearch() {
        const searchValue = document.getElementById('searchAnime').value.toLowerCase();
        document.querySelectorAll('.gallery-item').forEach(item => {
            const title = item.querySelector('h3').innerText.toLowerCase();
            const itemGenres = item.getAttribute('data-genres').split(',');
            const matchesGenre = (currentGenreFilter === 'all' || itemGenres.includes(currentGenreFilter));
            const matchesSearch = title.includes(searchValue);
            if (matchesGenre && matchesSearch) { item.classList.remove('hide'); } else { item.classList.add('hide'); }
        });
    }

    function openAnimeUI(index) {
        activeAnimeIndex = index;
        activeSeasonIndex = 0;
        const anime = myAnimes[index];

        document.getElementById('modalTitle').innerText = anime.title;
        document.getElementById('modalPoster').src = anime.img;
        document.getElementById('modalGenres').innerHTML = anime.genres.map(g => `<span class="genre-tag">${g}</span>`).join('');
        
        document.getElementById('videoWrapper').style.display = "none";
        document.getElementById('videoPlayer').src = "";

        renderSeasons(anime);
        renderEpisodes(anime, 0);

        document.getElementById('playerModal').classList.add('show');
    }

    function renderSeasons(anime) {
        const tabsContainer = document.getElementById('seasonTabs');
        if (anime.seasons && anime.seasons.length > 0) {
            tabsContainer.innerHTML = anime.seasons.map((season, idx) => `
                <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="switchSeason(${idx})">${season.name}</button>
            `).join('');
        } else {
            tabsContainer.innerHTML = `<button class="tab-btn active">Season 1</button>`;
        }
    }

    function renderEpisodes(anime, seasonIdx) {
        const gridContainer = document.getElementById('episodeGrid');
        let episodes = [];
        if (anime.seasons && anime.seasons[seasonIdx]) {
            episodes = anime.seasons[seasonIdx].episodes || [];
        } else if (anime.episodes) {
            episodes = anime.episodes;
        }

        if (episodes.length > 0) {
            gridContainer.innerHTML = episodes.map((ep, idx) => `
                <button class="ep-btn" id="ep-btn-${idx}" onclick="playEpisode('${ep.url}', ${idx})">Eps ${ep.num || (idx + 1)}</button>
            `).join('');
        } else {
            gridContainer.innerHTML = `<p style="font-size:0.8rem; color:gray;">Belum ada episode tersedia.</p>`;
        }
    }

    function switchSeason(idx) {
        activeSeasonIndex = idx;
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === idx);
        });
        renderEpisodes(myAnimes[activeAnimeIndex], idx);
        document.getElementById('videoWrapper').style.display = "none";
        document.getElementById('videoPlayer').src = "";
    }

    function playEpisode(url, idx) {
        document.querySelectorAll('.ep-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === idx);
        });
        currentVideoUrl = url ? url : "https://www.youtube.com/embed/dQw4w9WgXcQ";
        document.getElementById('adsLayer').style.display = "flex";
        document.getElementById('videoPlayer').src = ""; 
        document.getElementById('videoWrapper').style.display = "block";
    }

    function triggerAd() {
        window.open('https://google.com', '_blank'); 
        document.getElementById('adsLayer').style.display = "none";
        document.getElementById('videoPlayer').src = currentVideoUrl;
    }

    function closePlayer() {
        document.getElementById('playerModal').classList.remove('show');
        document.getElementById('videoPlayer').src = ""; 
    }

    window.onload = () => { 
        renderAnime(); 
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000); 
    };

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123 || 
            (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(String.fromCharCode(e.keyCode))) || 
            (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
            return false;
        }
    };
    </script>
</body>
</html>
