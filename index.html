<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Vault | FryMediaOfficial</title>
    <style>
        :root {
            --pink-neon: #ff0055;
            --pink-glow: rgba(255, 0, 85, 0.4);
            --bg: #0d0005;
            --card-bg: #1e000e;
            --border: rgba(255, 0, 85, 0.2);
            --text-light: #ffccd9;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            padding: 20px 5%; background: rgba(13, 0, 5, 0.85); 
            border-bottom: 2px solid var(--border); position: relative; z-index: 10;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
        }

        .clock-container { font-size: 1.2rem; color: var(--pink-neon); font-weight: bold; margin-bottom: 5px; }
        .glowing-title {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            color: var(--pink-neon); filter: drop-shadow(0 0 8px var(--pink-glow));
        }

        .main-container {
            max-width: 900px; margin: 20px auto; padding: 15px; 
            background: rgba(255, 0, 85, 0.02); border-radius: 20px;
            border: 1px dashed var(--border); position: relative; z-index: 10;
        }

        /* FITUR PENCARIAN */
        .search-container {
            margin: 15px auto; max-width: 400px; padding: 0 15px;
        }
        .search-bar {
            width: 100%; padding: 10px 15px; border-radius: 50px;
            border: 1px solid var(--pink-neon); background: rgba(30, 0, 14, 0.6);
            color: white; font-size: 0.9rem; outline: none; box-sizing: border-box;
            transition: 0.3s; text-align: center;
        }
        .search-bar:focus { box-shadow: 0 0 10px var(--pink-neon); }

        .filter-buttons { margin: 10px 0 20px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 10px; }
        .filter-btn {
            padding: 8px 12px; background: transparent; border: 1px solid var(--pink-neon);
            color: var(--pink-neon); border-radius: 50px; font-weight: 600; font-size: 0.7rem; transition: 0.3s;
            cursor: pointer; text-transform: uppercase;
        }
        .filter-btn.active { background: var(--pink-neon); color: white; box-shadow: 0 0 10px var(--pink-neon); }

        .gallery {
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 12px; max-width: 1100px; margin: 0 auto 80px; padding: 12px;
        }
        
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }

        .gallery-item {
            background: var(--card-bg); padding: 8px; border-radius: 15px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            text-align: left; overflow: hidden; cursor: pointer;
        }
        .gallery-item:hover { transform: translateY(-5px); box-shadow: 0 5px 15px var(--pink-glow); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .gallery-item h3 { font-size: 0.8rem; margin: 8px 0 4px 0; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.2em; line-height: 1.1em; }
        .gallery-item.hide { display: none !important; }

        .fav-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(255, 0, 85, 0.9);
            color: white; padding: 2px 6px; border-radius: 5px; font-size: 0.65rem; font-weight: bold;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 2;
        }

        .type-badge {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.7);
            color: #fff; padding: 2px 6px; border-radius: 5px; font-size: 0.6rem; font-weight: bold;
            border: 1px solid var(--border); z-index: 2;
        }

        .status-label { color: var(--pink-neon); font-size: 0.6rem; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        
        /* POP-UP MODAL PLAYER STYLE */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 0, 5, 0.9); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1e000e; width: 90%; max-width: 700px;
            padding: 20px; border-radius: 20px; border: 2px solid var(--pink-neon);
            box-shadow: 0 0 25px var(--pink-neon); position: relative;
            text-align: center;
        }
        .close-btn {
            position: absolute; top: -15px; right: -15px; width: 35px; height: 35px;
            background: var(--pink-neon); border: none; border-radius: 50%;
            color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 10px var(--pink-neon);
        }
        .video-container {
            position: relative; width: 100%; padding-bottom: 56.25%; /* 16:9 Ratio */
            height: 0; border-radius: 10px; overflow: hidden; background: #000;
            margin-top: 15px;
        }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        /* IKLAN LAYER */
        .ads-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 10, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; border-radius: 10px;
        }
        .ads-btn {
            padding: 12px 24px; background: var(--pink-neon); border: none;
            color: white; font-weight: bold; border-radius: 50px; cursor: pointer;
            box-shadow: 0 0 15px var(--pink-neon); font-size: 0.9rem; text-transform: uppercase;
        }

        footer { padding: 30px; color: #55001a; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <header>
        <div class="clock-container"><span id="clock">00:00:00</span></div>
        <h1 class="glowing-title">ANIME VAULT</h1>
    </header>

    <div class="main-container">
        <p style="color: var(--text-light); margin:0; font-size: 0.85rem; font-style: italic;">Daftar & Streaming Anime Pilihan Sanzs 💖</p>
    </div>

    <!-- FITUR INPUT SEARCH -->
    <div class="search-container">
        <input type="text" id="searchAnime" class="search-bar" placeholder="Cari judul anime kamu di sini..." onkeyup="searchAnimeFunc()">
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGallery('all', this)">SEMUA</button>
        <button class="filter-btn" onclick="filterGallery('is-fav', this)">FAVORIT ❤️</button>
        <button class="filter-btn" onclick="filterGallery('type-tv', this)">TV</button>
        <button class="filter-btn" onclick="filterGallery('type-movie', this)">MOVIE</button>
        <button class="filter-btn" onclick="filterGallery('watching', this)">WATCHING</button>
        <button class="filter-btn" onclick="filterGallery('completed', this)">TAMAT</button>
        <button class="filter-btn" onclick="filterGallery('belum', this)">BELUM</button>
    </div>
    
    <div class="gallery" id="anime-list"></div>

    <!-- POP-UP PLAYER MODAL -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closePlayer()">X</button>
            <h2 id="modalTitle" style="margin: 0; font-size: 1.2rem; color: white;">Stream Player</h2>
            <div class="video-container">
                <!-- Lapisan Iklan -->
                <div id="adsLayer" class="ads-overlay">
                    <p style="font-size: 0.85rem; margin-bottom: 15px;">Sponsori FryMedia dengan mengeklik tombol di bawah ini untuk menonton!</p>
                    <button class="ads-btn" onclick="triggerAd()">Saksikan & Lewati Iklan 🚀</button>
                </div>
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <footer>&copy; 2026 FryMediaOfficial | Sanzs' Vault</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#ff0055"}, "size": {"value": 1}, "move": {"enable": true, "speed": 1}}});

    // DATA ANIME SEMENTARA (Nanti tinggal dipindah ke database.js)
    const myAnimes = [
        { title: "Tonikaku Kawaii", status: "completed", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1613/108722.jpg", video: "https://www.youtube.com/embed/dQw4w9WgXcQ" },
        { title: "Spy X Family", status: "completed", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1441/122795.jpg", video: "" },
        { title: "Horimiya", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1695/111486.jpg", video: "" },
        { title: "Tsuki Ga Kirei", status: "belum", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/2/85592.jpg", video: "" },
        { title: "Chuunibyou Demo Koi Ga Shitai", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/7/56643.jpg", video: "" },
        { title: "Shiro Seijo To Kuro Bokushi", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1329/135096.jpg", video: "" },
        { title: "Giji Harem", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1607/143547.jpg", video: "" },
        { title: "Roshidere", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1596/152806.jpg", video: "" },
        { title: "The Angel Next Door", status: "completed", type: "tv", fav: true, img: "https://cdn.myanimelist.net/images/anime/1989/154843.jpg", video: "" },
        { title: "The Girl I Like Forgot Her Glasses", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1582/136325.jpg", video: "" },
        { title: "Gimai Seikatsu", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1420/143707.jpg", video: "" },
        { title: "Kaoru Hana wa Rin to Saku", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1744/150433.jpg", video: "" },
        { title: "Taisho Otome Otogibanashi", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1662/118849.jpg", video: "" },
        { title: "Mamahaha no Tsurego", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1708/123281.jpg", video: "" },
        { title: "Kubo-san wa Mob wo Yurusanai", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1818/132330.jpg", video: "" },
        { title: "Insomniacs After School", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1402/134007.jpg", video: "" },
        { title: "Bokiyou na Senpai", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1257/152233.jpg", video: "" },
        { title: "Yuru Camp", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/4/89877.jpg", video: "" },
        { title: "Seihantai na Kimi to Boku", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1140/154457.jpg", video: "" },
        { title: "Kimi ni Todoke", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1502/124384.jpg", video: "" },
        { title: "Kono Kaisha ni Suki na Hito ga Imasu", status: "watching", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1123/146384.jpg", video: "" },
        { title: "My Love Story with Yamada -kun", status: "belum", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1247/136306.jpg", video: "" },
        { title: "Yubisaki to Renren", status: "belum", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1917/139396.jpg", video: "" },
        { title: "Kimi No Nawa", status: "completed", type: "movie", fav: true, img: "https://cdn.myanimelist.net/images/anime/5/87048.jpg", video: "" },
        { title: "Tenki No Ko", status: "completed", type: "movie", fav: true, img: "https://cdn.myanimelist.net/images/anime/1880/101146.jpg", video: "" }
    ];

    let currentVideoUrl = "";
    let currentFilter = "all";

    function renderAnime() {
        document.getElementById('anime-list').innerHTML = myAnimes.map((anime, index) => `
            <div class="gallery-item ${anime.status} ${anime.fav ? 'is-fav' : ''} type-${anime.type}" onclick="openPlayer('${anime.title.replace(/'/g, "\\'")}', '${anime.video}')">
                ${anime.fav ? '<div class="fav-badge">❤️</div>' : ''}
                <div class="type-badge">${anime.type.toUpperCase()}</div>
                <img src="${anime.img}" alt="${anime.title}">
                <h3>${anime.title}</h3>
                <span class="status-label">${anime.status}</span>
            </div>
        `).join('');
    }

    // FILTER TOMBOL
    function filterGallery(category, btnElement) {
        currentFilter = category;
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');
        applyFilterAndSearch();
    }

    // FITUR PENCARIAN REAL-TIME
    function searchAnimeFunc() {
        applyFilterAndSearch();
    }

    // KOMBINASI FILTER & SEARCH JALAN BARENGAN
    function applyFilterAndSearch() {
        const searchValue = document.getElementById('searchAnime').value.toLowerCase();
        document.querySelectorAll('.gallery-item').forEach(item => {
            const title = item.querySelector('h3').innerText.toLowerCase();
            const matchesCategory = (currentFilter === 'all' || item.classList.contains(currentFilter));
            const matchesSearch = title.includes(searchValue);

            if (matchesCategory && matchesSearch) {
                item.classList.remove('hide');
            } else {
                item.classList.add('hide');
            }
        });
    }

    /* SISTEM PLAYER & IKLAN POP-UP */
    function openPlayer(title, videoUrl) {
        document.getElementById('modalTitle').innerText = title;
        currentVideoUrl = videoUrl ? videoUrl : "https://www.youtube.com/embed/dQw4w9WgXcQ"; 
        
        document.getElementById('adsLayer').style.display = "flex";
        document.getElementById('videoPlayer').src = ""; 

        document.getElementById('playerModal').classList.add('show');
    }

    function triggerAd() {
        // Silakan ganti link iklan/safelink milik FryMedia di sini
        window.open('https://google.com', '_blank'); 
        
        document.getElementById('adsLayer').style.display = "none";
        document.getElementById('videoPlayer').src = currentVideoUrl;
    }

    function closePlayer() {
        document.getElementById('playerModal').classList.remove('show');
        document.getElementById('videoPlayer').src = ""; 
    }

    window.onload = () => { 
        renderAnime(); 
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000); 
    };
    </script>
</body>
</html>
