<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Vault | FryMediaOfficial</title>
    <style>
        :root {
            --pink-neon: #ff0055;
            --pink-glow: rgba(255, 0, 85, 0.4);
            --bg: #0d0005;
            --card-bg: #1e000e;
            --border: rgba(255, 0, 85, 0.2);
            --text-light: #ffccd9;
        }

        body {
            background-color: var(--bg);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; text-align: center;
            overflow-x: hidden; scroll-behavior: smooth;
        }

        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }

        header { 
            padding: 20px 5%; background: rgba(13, 0, 5, 0.85); 
            border-bottom: 2px solid var(--border); position: relative; z-index: 10;
            backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center;
        }

        .clock-container { font-size: 1.2rem; color: var(--pink-neon); font-weight: bold; margin-bottom: 5px; }
        .glowing-title {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 3px; margin: 0;
            color: var(--pink-neon); filter: drop-shadow(0 0 8px var(--pink-glow));
        }

        .main-container {
            max-width: 900px; margin: 20px auto; padding: 15px; 
            background: rgba(255, 0, 85, 0.02); border-radius: 20px;
            border: 1px dashed var(--border); position: relative; z-index: 10;
        }

        .filter-buttons { margin: 20px 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 10px; }
        .filter-btn {
            padding: 8px 12px; background: transparent; border: 1px solid var(--pink-neon);
            color: var(--pink-neon); border-radius: 50px; font-weight: 600; font-size: 0.7rem; transition: 0.3s;
            cursor: pointer; text-transform: uppercase;
        }
        .filter-btn.active { background: var(--pink-neon); color: white; box-shadow: 0 0 10px var(--pink-neon); }

        .gallery {
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 12px; max-width: 1100px; margin: 0 auto 80px; padding: 12px;
        }
        
        @media (min-width: 768px) { .gallery { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); } }

        .gallery-item {
            background: var(--card-bg); padding: 8px; border-radius: 15px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            text-align: left; overflow: hidden;
        }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; }
        .gallery-item h3 { font-size: 0.8rem; margin: 8px 0 4px 0; color: white; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.2em; line-height: 1.1em; }
        .gallery-item.hide { display: none !important; }

        .fav-badge {
            position: absolute; top: 12px; left: 12px; background: rgba(255, 0, 85, 0.9);
            color: white; padding: 2px 6px; border-radius: 5px; font-size: 0.65rem; font-weight: bold;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 2;
        }

        .type-badge {
            position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, 0.7);
            color: #fff; padding: 2px 6px; border-radius: 5px; font-size: 0.6rem; font-weight: bold;
            border: 1px solid var(--border); z-index: 2;
        }

        .status-label { color: var(--pink-neon); font-size: 0.6rem; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        footer { padding: 30px; color: #55001a; font-size: 0.7rem; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <header>
        <div class="clock-container"><span id="clock">00:00:00</span></div>
        <h1 class="glowing-title">ANIME VAULT</h1>
    </header>

    <div class="main-container">
        <p style="color: var(--text-light); margin:0; font-size: 0.85rem; font-style: italic;">Daftar Anime Pilihan Sanzs 💖</p>
    </div>

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterGallery('all')">SEMUA</button>
        <button class="filter-btn" onclick="filterGallery('is-fav')">FAVORIT ❤️</button>
        <button class="filter-btn" onclick="filterGallery('type-tv')">TV</button>
        <button class="filter-btn" onclick="filterGallery('type-movie')">MOVIE</button>
        <button class="filter-btn" onclick="filterGallery('watching')">WATCHING</button>
        <button class="filter-btn" onclick="filterGallery('completed')">TAMAT</button>
        <button class="filter-btn" onclick="filterGallery('belum')">BELUM</button>
    </div>
    
    <div class="gallery" id="anime-list"></div>

    <footer>&copy; 2026 FryMediaOfficial | Sanzs' Vault</footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
    particlesJS("particles-js", {"particles": {"number": {"value": 40}, "color": {"value": "#ff0055"}, "size": {"value": 1}, "move": {"enable": true, "speed": 1}}});

    const myAnimes = [
        { title: "Tonikaku Kawaii", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1613/108722.jpg" },
        { title: "Spy X Family", status: "completed", type: "tv", fav: false, img: "https://cdn.myanimelist.net/images/anime/1441/122795.jpg" },
        { title: "Horimiya", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1695/111486.jpg" },
        { title: "Tsuki Ga Kirei", status: "belum", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/2/85592.jpg" },
        { title: "Chuunibyou Demo Koi Ga Shitai", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/7/56643.jpg" },
        { title: "Shiro Seijo To Kuro Bokushi", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1329/135096.jpg" },
        { title: "Giji Harem", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1607/143547.jpg" },
        { title: "Roshidere", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1596/152806.jpg" },
        { title: "The Angel Next Door", status: "completed", type: "tv", fav: true, img: "https://cdn.myanimelist.net/images/anime/1989/154843.jpg" },
        { title: "The Girl I Like Forgot Her Glasses", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1582/136325.jpg" },
        { title: "Gimai Seikatsu", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1420/143707.jpg" },
        { title: "Kaoru Hana wa Rin to Saku", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1744/150433.jpg" },
        { title: "Taisho Otome Otogibanashi", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1662/118849.jpg" },
        { title: "Mamahaha no Tsurego", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1708/123281.jpg" },
        { title: "Kubo-san wa Mob wo Yurusanai", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1818/132330.jpg" },
        { title: "Insomniacs After School", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/1402/134007.jpg" },
        { title: "Bokiyou na Senpai", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1257/152233.jpg" },
        { title: "Yuru Camp", status: "completed", type: "tv", fav: true, img: "https://myanimelist.net/images/anime/4/89877.jpg" },
        { title: "Seihantai na Kimi to Boku", status: "completed", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1140/154457.jpg" },
        { title: "Kimi ni Todoke", status: "watching", type: "tv", fav: false, img: "https://myanimelist.net/images/anime/1311/121574.jpg" }
    ];

    function renderAnime() {
        document.getElementById('anime-list').innerHTML = myAnimes.map(anime => `
            <div class="gallery-item ${anime.status} ${anime.fav ? 'is-fav' : ''} type-${anime.type}">
                ${anime.fav ? '<div class="fav-badge">❤️</div>' : ''}
                <div class="type-badge">${anime.type.toUpperCase()}</div>
                <img src="${anime.img}" alt="${anime.title}">
                <h3>${anime.title}</h3>
                <span class="status-label">${anime.status}</span>
            </div>
        `).join('');
    }

    function filterGallery(category) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        document.querySelectorAll('.gallery-item').forEach(item => { 
            if (category === 'all') {
                item.classList.remove('hide');
            } else {
                item.classList.contains(category) ? item.classList.remove('hide') : item.classList.add('hide');
            }
        });
    }

    window.onload = () => { 
        renderAnime(); 
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID'); }, 1000); 
    };
    </script>
</body>
</html>
